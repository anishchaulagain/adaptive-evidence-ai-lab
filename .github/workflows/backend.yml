name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aelab
          POSTGRES_PASSWORD: aelab
          POSTGRES_DB: aelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aelab -d aelab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The test harness derives `aelab_test` from this and runs the real
      # migrations against it.
      DATABASE_URL: postgresql+asyncpg://aelab:aelab@localhost:5432/aelab
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-not-used-for-anything-real
      ENVIRONMENT: development
      LOG_FORMAT: json
      # Deliberately unset: the suite must pass with no provider key, using a
      # deterministic embedder. Live provider checks skip themselves.
      MISTRAL_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy .

      - name: Tests
        run: pytest --cov --cov-report=term-missing

      - name: Migrations are reversible
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: No model drift from migrations
        run: |
          alembic check
