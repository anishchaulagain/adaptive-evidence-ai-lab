[project]
name = "adaptive-evidence-ai-lab-backend"
version = "0.1.0"
description = "Backend for Adaptive Evidence AI Lab — adaptive retrieval, model routing and evaluation platform."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",      # multipart uploads (POST /documents/upload)
    "orjson>=3.10",
    # --- config & validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- persistence ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # --- cache / queue ---
    "redis>=5.2",
    "arq>=0.26",                      # async-native worker; pairs with asyncio + Redis
    # --- observability ---
    "structlog>=24.4",
    # --- outbound ---
    "httpx>=0.28",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]
# Provider adapters are optional so the core platform never hard-depends on one vendor.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.57"]
google = ["google-genai>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "core",
    "models",
    "evaluation",
    "benchmark",
    "experiments",
    "visualization",
]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "T20",       # no print()  — use structured logging (spec section 48)
    "SIM",       # simplify
    "TCH",       # type-checking imports
    "RUF",
]
ignore = [
    "B008",      # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/*" = ["N999", "E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "app", "core", "models", "evaluation", "benchmark", "experiments", "visualization",
]

# --------------------------------------------------------------------------
# mypy — the spec requires type safety (rule 13)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_defs = true
exclude = "^alembic/versions/"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast, no external services",
    "integration: requires Postgres and/or Redis",
    "evaluation: exercises the evaluation lab",
    "benchmark: AE-Bench reproducibility runs (slow)",
]

[tool.coverage.run]
source = ["app", "core", "models", "evaluation"]
omit = ["*/__init__.py", "alembic/*"]
